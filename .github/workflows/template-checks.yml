name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instructions:
    name: Instruction consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check shared instructions
        run: python scripts/sync_instructions.py --check

  windows-cli:
    name: Windows CLI
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f735447658e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install Windows wheels
        run: 'python -m pip install --only-binary=:all: -r requirements.txt'
      - name: Check dependencies
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q talk2coding.py
      - name: Check in-memory WAV decoding
        run: |
          @'
          from faster_whisper.audio import decode_audio
          from talk2coding import pcm_to_wav

          with pcm_to_wav(b"\x00\x10" * 48_000, 48_000) as audio:
              samples = decode_audio(audio, sampling_rate=16_000)
          assert samples.shape == (16_000,)
          assert abs(float(samples[8_000]) - 0.125) < 0.001
          '@ | python -
      - name: Start CLI
        env:
          PYTHONIOENCODING: utf-8
        run: python talk2coding.py --check
